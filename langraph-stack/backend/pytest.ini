[tool:pytest]
# pytest配置文件

# 测试发现
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# 输出配置
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --strict-config
    --disable-warnings
    --color=yes
    --durations=10
    --cov=src/agent
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-report=xml
    --junit-xml=test-results.xml

# 标记定义
markers =
    unit: 单元测试
    integration: 集成测试
    slow: 慢速测试 (超过1秒)
    network: 需要网络连接的测试
    async_test: 异步测试
    smoke: 冒烟测试
    regression: 回归测试
    security: 安全测试
    performance: 性能测试

# 过滤警告
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*unclosed.*:ResourceWarning

# 最小版本要求
minversion = 6.0

# 异步测试配置
asyncio_mode = auto

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 测试超时
timeout = 300

# 覆盖率配置
[coverage:run]
source = src/agent
omit = 
    */tests/*
    */test_*
    */__pycache__/*
    */.*
    */venv/*
    */.venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod 