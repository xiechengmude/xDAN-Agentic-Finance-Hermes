version: '3.8'

services:
  # xDAN Backend Service - Development Mode
  xdan-backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: xdan-backend-dev
    ports:
      - "8000:8000"
    environment:
      - MODEL_BASE_URL=${MODEL_BASE_URL:-http://161.248.3.20:32790/v1}
      - MODEL_NAME=${MODEL_NAME:-xDAN-Agent-Medium-v2-step300-0525}
      - MODEL_API_KEY=${MODEL_API_KEY:-dummy_key}
      - MCP_SERVER_URL=${MCP_SERVER_URL:-http://43.134.62.139:7223/sse}
      - MAX_ITERATIONS=${MAX_ITERATIONS:-3}
      - DEFAULT_TEMPERATURE=${DEFAULT_TEMPERATURE:-0.7}
      - MAX_TOKENS=${MAX_TOKENS:-2048}
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - ENABLE_DEBUG=${ENABLE_DEBUG:-true}
    volumes:
      - ../data:/app/data
      - ../tools:/app/tools
      - ../adapters:/app/adapters  # Hot reload for development
      - ../api:/app/api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - xdan-network

  # Frontend Service - Development Mode
  xdan-frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend.dev
    container_name: xdan-frontend-dev
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    volumes:
      - ../frontend/src:/app/src  # Hot reload for development
      - ../frontend/public:/app/public
    depends_on:
      xdan-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - xdan-network

networks:
  xdan-network:
    driver: bridge

volumes:
  xdan-data:
    driver: local